(()=>{

    if(!signedIn)throw new Error('请先登录');

   }

  },

     const bytes=Uint8Array.from(atob(bundle.documents[name]),c=>c.charCodeAt(0));

function bindComposer(id,fromHome=false){
  const form=$('#'+id);if(!form)return;
  form.onsubmit=e=>{e.preventDefault();const input=form.querySelector('textarea');const value=input.value.trim();if(!value)return;addConversation(value);if(fromHome)go('class');else render();};
  form.querySelector('textarea').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();form.requestSubmit();}};
}

function coursePage(route){

function parseCourseHash(hash){
  const value=String(hash||'').replace(/^#/,''),index=value.indexOf('?');
  const path=index<0?value:value.slice(0,index),params=new URLSearchParams(index<0?'':value.slice(index+1));
  const [kind,key='']=path.split('/');let decoded=key;try{decoded=decodeURIComponent(key);}catch{}
  return {kind,key:decoded,params};
}
function isCourseList(hash){return ['course','home','classes','schedules'].includes(parseCourseHash(hash).kind);}
function renderCourseNavigation(hash,links){
  if(!courseNavState)return;
  const route=parseCourseHash(hash),detail=['session','results','class'].includes(route.kind),previous=parseCourseHash(courseNavState.hash);
  if(detail&&!['session','results','class'].includes(previous.kind)&&isCourseList(courseNavState.hash))courseNavState.origin=courseNavState.hash;
  courseNavState.hash=hash;
  const base=[{label:'课程总览',kind:'course',hash:'#course/'+encodeURIComponent(courseNavState.course)},{label:'班级与课次',kind:'classes',hash:'#classes'},{label:'指标说明',kind:'sources',hash:route.kind==='sources'?hash:'#sources?from='+encodeURIComponent(hash)}];
  const activeKind=detail?(route.params.get('tab')==='learners'?'classes':parseCourseHash(courseNavState.origin).kind):route.kind==='home'?'course':route.kind;
  frameNavigation=base;
  $('#course-tabs').innerHTML=base.map((item,i)=>`<button data-frame-nav="${i}" class="${item.kind===activeKind?'active':''}" ${item.kind===activeKind?'aria-current="page"':''}>${item.label}</button>`).join('');
  const section=$('#session-navigation');section.hidden=!detail;
  if(!detail){section.innerHTML='';return;}
  const course=courses.find(c=>c.name===courseNavState.course),session=route.kind==='session'?course?.sessions.find(s=>s.session_id===route.key):course?.sessions.find(s=>s.class_id===route.key&&(!route.params.get('session')||s.session_id===route.params.get('session')));
  const documentInFrame=$('#course-frame')?.contentDocument;
  const start=route.params.get('start')||documentInFrame?.querySelector('input[name="start"]')?.value||'';
  const end=route.params.get('end')||documentInFrame?.querySelector('input[name="end"]')?.value||'';
  const phase=session&&start&&end?(start>=session.start_date&&end<=session.end_date?'classroom':start>session.end_date?'post':'custom'):route.params.get('phase')||'post';
  courseNavState.session=session;courseNavState.phase=phase;
  const originLabel=base.find(b=>b.kind===parseCourseHash(courseNavState.origin).kind)?.label||'班级与课次';
  const automationEnabled=['增长战略','战略运营'].includes(courseNavState.course);
  const detailLinks=links.filter(item=>['session','results','class'].includes(parseCourseHash(item.hash).kind)&&(automationEnabled||parseCourseHash(item.hash).params.get('tab')!=='automation')).map(item=>{const target=parseCourseHash(item.hash),currentTab=route.params.get('tab')||'skill',targetTab=target.params.get('tab');if(targetTab!==currentTab&&[currentTab,targetTab].includes('tags')){target.params.delete('q');target.params.set('page','1');}if(session)target.params.set('session',session.session_id);return {...item,label:item.label==='战略自动化'?'自动化应用':item.label,hash:'#'+target.kind+'/'+encodeURIComponent(target.key)+'?'+target.params};});
  frameNavigation=base.concat(detailLinks);
  section.innerHTML=`<div class="session-context"><button class="session-back" data-action="back-course-list">${icon('arrow-left')}返回${originLabel}</button><nav class="session-tabs" aria-label="课次分析入口">${detailLinks.map((item,i)=>`<button data-frame-nav="${i+base.length}" class="${item.active?'active':''}" ${item.active?'aria-current="page"':''}>${esc(item.label)}</button>`).join('')}</nav></div>`;
  refreshIcons();
}

window.addEventListener('message',e=>{
  if((!window.OfflinePrototype&&e.origin!==location.origin) || e.source!==$('#course-frame')?.contentWindow)return;
  if(e.data.type==='aimind-course-back'){if(user.role==='leader')location.hash=LeaderDashboard.returnHash();else go('dashboard');return;}
  if(e.data.type!=='aimind-course-nav')return;
  const nav=$('#course-tabs');if(!nav)return;
  const embeddedDocument=$('#course-frame').contentDocument;
  for(const link of embeddedDocument.querySelectorAll('.head a[href*="工作台"],.head a[href*="课程选择"]'))link.style.display='none';
  if(['session','results','class'].includes(parseCourseHash(e.data.hash).kind)){
    for(const breadcrumb of embeddedDocument.querySelectorAll('#main-content .crumb'))breadcrumb.remove();
    for(const action of embeddedDocument.querySelectorAll('#main-content .head .head-actions a,#main-content .head .head-actions button'))if(['返回课程','指标说明'].includes(action.textContent.trim()))action.remove();
  }
  if(['session','results','class','course','home','roster','schedules','classes'].includes(parseCourseHash(e.data.hash).kind)){
    const subtitle=embeddedDocument.querySelector('#main-content .head > div:first-child > p'),metadata=[...embeddedDocument.querySelectorAll('#main-content .meta-line,#main-content .v-context')].find(n=>!n.closest('.session-subtitle-row'));
    if(subtitle&&metadata){
      const row=embeddedDocument.createElement('div');row.className='session-subtitle-row';row.style.cssText='display:flex;align-items:center;gap:14px;flex-wrap:wrap';
      subtitle.replaceWith(row);row.append(subtitle,metadata);subtitle.style.margin='0';
      metadata.style.cssText='margin:0;padding-left:14px;border-left:1px solid #dce1e9;line-height:21.6px';
    }
  }
  if(['course','home'].includes(parseCourseHash(e.data.hash).kind)){
    const head=embeddedDocument.querySelector('#main-content > .head'),summaryRow=head?.querySelector('.session-subtitle-row'),toolbar=embeddedDocument.querySelector('#main-content > .comparison-toolbar'),classField=toolbar?.querySelector('.comparison-field');
    if(summaryRow&&classField){

      head.style.columnGap='0';
      classField.style.marginLeft='auto';
      summaryRow.append(classField);
      toolbar.remove();
    }
  }
  renderCourseNavigation(e.data.hash,(e.data.links||[]).filter(x=>x.hash));
  const route=currentRoute();if(route.kind==='dashboard'&&route.course && e.data.hash){const params=new URLSearchParams({view:e.data.hash});if(['session','results','class','sources'].includes(parseCourseHash(e.data.hash).kind))params.set('origin',courseNavState.origin);history.replaceState(null,'',url('dashboard/course/'+encodeURIComponent(route.course))+'?'+params);}
});

}

<script>
const LeaderDashboard=window.LeaderDashboard=(()=>{
 const data=JSON.parse(document.getElementById('leader-data').textContent),U=JSON.parse(document.getElementById('leader-usage-data').textContent);
 const K=JSON.parse(document.getElementById('skill-prototype-summary').textContent);
 function skillUsage(rows,s){
  const p=period(s),dates=[];for(let day=p.start;day<=p.end;day=add(day,1))dates.push(day);
  const sources=K.filter(d=>rows.some(r=>r.course===d.course&&r.classId===d.classId&&r.start===d.start));
  const users=new Set(),daily=dates.map(()=>0);let available=sources.length>0;
  for(const d of sources){const indexes=dates.map(day=>d.days.indexOf(day));for(const r of d.instances){if(r.created&&r.created.slice(0,10)>p.end)continue;const values=indexes.map(i=>i>=0?r.calls[i]:null);if(!values.every(Number.isFinite)){available=false;continue;}if(values.some(v=>v>0))users.add(r.id);values.forEach((n,i)=>daily[i]+=n);}}
  return {skillUsers:available?users.size:null,skillCalls:available?daily.reduce((a,b)=>a+b,0):null,skillDaily:available?daily:dates.map(()=>null),skillAvailable:available};
 }
 const names=unique(data.rows.map(r=>r.course)),knownClasses=new Set(U.knownClasses),dayIndex=new Map(U.days.map((d,i)=>[d,i])),cache=new Map();
 const defaults={start:data.rows.filter(r=>r.dateKnown&&!r.future).map(r=>r.start).sort()[0],end:data.asOf,course:'all',sort:'course',window:'7'};
 let current={...defaults},lastHash='#/leader';
 try{const saved=sessionStorage.getItem('aimind-prototype-leader-view');if(/^#\/leader(?:\?|$)/.test(saved||''))lastHash=saved;}catch{}
 const nf=n=>Number.isFinite(n)?n.toLocaleString('zh-CN'):'—';
 const add=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*86400000).toISOString().slice(0,10);
 const period=s=>({start:add(U.asOf,1-Number(s.window)),end:U.asOf});
 const hp=s=>{const q=new URLSearchParams();for(const k of Object.keys(defaults))if(s[k]!==defaults[k])q.set(k,s[k]);return '#/leader'+(q.size?'?'+q:'');};
 function read(){const q=new URLSearchParams(location.hash.split('?')[1]||''),s={...defaults};for(const k of Object.keys(s))if(q.has(k))s[k]=q.get(k);if(!/^\d{4}-\d{2}-\d{2}$/.test(s.start)||!/^\d{4}-\d{2}-\d{2}$/.test(s.end)||s.start>s.end){s.start=defaults.start;s.end=defaults.end;}if(!names.includes(s.course))s.course='all';if(!['course','sessions','active','requests'].includes(s.sort))s.sort='course';if(!['7','30'].includes(s.window))s.window='7';return s;}
 function scoped(s){const seen=new Set();return data.rows.filter(r=>{if(!r.dateKnown||r.future||!r.classId||!r.id||r.start<s.start||r.start>s.end||r.start>r.asOf||(s.course!=='all'&&r.course!==s.course))return false;const key=JSON.stringify([r.course,r.classId,r.id]);if(seen.has(key))return false;seen.add(key);return true;});}
 const hasSigned=r=>Number.isInteger(r.signed)&&r.signed>=0;
 function usage(rows,s=current){const classes=unique(rows.map(r=>r.classId)).sort(),p=period(s),key=classes.join('|')+'|'+s.window;if(cache.has(key))return cache.get(key);const covered=classes.filter(c=>knownClasses.has(c)),dates=[];for(let day=p.start;day<=p.end;day=add(day,1))dates.push(day);const indexes=dates.map(d=>dayIndex.get(d)),seen=new Set(),instances=U.instances.filter(r=>{if(!covered.includes(r.classId)||r.created>p.end||seen.has(r.id))return false;seen.add(r.id);return true;});const available=covered.length>0&&indexes.every(Number.isInteger)&&instances.every(r=>indexes.every(i=>Number.isFinite(r.tokens[i])&&Number.isFinite(r.requests[i])));let active=null,requests=null,daily=dates.map(()=>null);if(available){active=instances.filter(r=>indexes.reduce((n,i)=>n+r.tokens[i],0)>=U.activeThreshold).length;daily=indexes.map(i=>instances.reduce((n,r)=>n+r.requests[i],0));requests=daily.reduce((a,b)=>a+b,0);}const result={active,requests,daily,dates,start:p.start,end:p.end,covered:covered.length,classes:classes.length,instances:instances.length,available};cache.set(key,result);return result;}
 function summary(rows,s=current){const known=rows.filter(hasSigned);return {sessions:rows.length,signed:known.length?known.reduce((n,r)=>n+r.signed,0):null,signedKnown:known.length,signedMissing:rows.length-known.length,...usage(rows,s),...skillUsage(rows,s)};}
 function groups(rows){const gs=names.filter(n=>rows.some(r=>r.course===n)).map(name=>{const rs=rows.filter(r=>r.course===name);return {name,owner:rs[0].owner,...summary(rs)};});return current.sort==='course'?gs:gs.sort((a,b)=>(b[current.sort==='active'?'skillUsers':current.sort==='requests'?'skillCalls':current.sort]??-1)-(a[current.sort==='active'?'skillUsers':current.sort==='requests'?'skillCalls':current.sort]??-1));}
 const help=(key,label)=>`<button class="leader-help" data-leader-help="${key}" aria-label="查看${label}计算口径">?</button>`;
 function kpi(label,value,unit,note,key){return `<article class="leader-kpi"><div><span>${label}</span>${help(key,label)}</div><strong>${nf(value)}<small>${unit}</small></strong>${note?`<p>${esc(note)}</p>`:''}</article>`;}

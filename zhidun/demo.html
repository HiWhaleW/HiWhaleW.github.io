<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线 Demo（Mock）· 智盾</title>
<style>
/* ==== 站点公共样式（原 assets/style.css，已内联以保证单文件可用） ==== */
/* ============================================================
   智盾 · 产品讲解站 — 设计系统（浅色模式）
   调色板基于 dataviz 参考色板（已通过 CVD/对比度校验，按序使用）
   ============================================================ */

:root {
  color-scheme: light;

  /* 表面与页面 */
  --surface-1: #fcfcfb;      /* 卡片面 */
  --page: #f9f9f7;           /* 页面底 */
  --surface-2: #f3f2ef;      /* 次级面（代码块、表格头） */

  /* 文字 */
  --ink-1: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;          /* 弱化（轴/辅助） */
  --hairline: #e1e0d9;       /* 发丝网格线 */
  --baseline: #c3c2b7;       /* 基线 */
  --ring: rgba(11, 11, 11, 0.10);

  /* 分类色（图表按序取用，勿循环、勿跳序） */
  --c1: #2a78d6;  /* 蓝 */
  --c2: #eb6834;  /* 橙 */
  --c3: #1baf7a;  /* 青 */
  --c4: #eda100;  /* 黄 */
  --c5: #e87ba4;  /* 品红 */
  --c6: #008300;  /* 绿 */
  --c7: #4a3aa7;  /* 紫 */
  --c8: #e34948;  /* 红 */

  /* 顺序色阶（蓝，浅→深） */
  --s100: #cde2fb; --s150: #b7d3f6; --s200: #9ec5f4; --s250: #86b6ef;
  --s300: #6da7ec; --s350: #5598e7; --s400: #3987e5; --s450: #2a78d6;
  --s500: #256abf; --s550: #1c5cab; --s600: #184f95; --s650: #104281; --s700: #0d366b;

  /* 状态色（仅作状态，不作系列色） */
  --good: #0ca30c;
  --good-text: #006300;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;

  /* 品牌主色 = 分类蓝 */
  --brand: #2a78d6;
  --brand-deep: #1c5cab;
  --brand-ink: #104281;
  --brand-wash: #eaf2fc;

  /* 字体 */
  --sans: system-ui, -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;

  /* 尺寸 */
  --radius: 10px;
  --radius-s: 6px;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.05), 0 4px 16px rgba(11, 11, 11, 0.05);
  --shadow-lift: 0 2px 4px rgba(11, 11, 11, 0.06), 0 10px 28px rgba(11, 11, 11, 0.09);
  --nav-h: 60px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: var(--sans);
  background: var(--page);
  color: var(--ink-1);
  font-size: 15.5px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}

/* ============ 顶部导航 ============ */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(252, 252, 251, 0.92);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--hairline);
}
.nav-inner {
  max-width: 1180px; margin: 0 auto; padding: 0 24px;
  height: var(--nav-h);
  display: flex; align-items: center; gap: 20px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink-1); margin-right: 6px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%);
  color: #fff; display: grid; place-items: center;
  font-size: 15px; font-weight: 700; letter-spacing: -0.5px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.22);
}
.brand-name { font-size: 17px; font-weight: 700; letter-spacing: 0.5px; }
.brand-sub { font-size: 11px; color: var(--ink-3); display: block; margin-top: -3px; letter-spacing: 0.5px; }

.nav-links { display: flex; align-items: center; gap: 2px; flex: 1; }
.nav-links > a, .nav-links > .nav-drop > summary {
  padding: 7px 12px; border-radius: 8px;
  font-size: 13.5px; font-weight: 500; color: var(--ink-2);
  text-decoration: none; cursor: pointer; list-style: none;
  white-space: nowrap; transition: background 0.15s, color 0.15s;
}
.nav-links > a:hover, .nav-links > .nav-drop > summary:hover { background: var(--surface-2); color: var(--ink-1); }
.nav-links > a.active { color: var(--brand-deep); font-weight: 600; background: var(--brand-wash); }

.nav-drop { position: relative; }
.nav-drop > summary::-webkit-details-marker { display: none; }
.nav-drop > summary::after { content: "▾"; font-size: 10px; margin-left: 4px; color: var(--ink-3); }
.nav-drop[open] > summary { background: var(--surface-2); color: var(--ink-1); }
.nav-menu {
  position: absolute; top: calc(100% + 6px); left: 0; min-width: 230px;
  background: var(--surface-1); border: 1px solid var(--hairline);
  border-radius: var(--radius); box-shadow: var(--shadow-lift);
  padding: 6px; z-index: 110;
}
.nav-menu a {
  display: flex; flex-direction: column; gap: 1px;
  padding: 8px 12px; border-radius: 8px; text-decoration: none;
}
.nav-menu a:hover { background: var(--brand-wash); }
.nav-menu .m-title { font-size: 13.5px; font-weight: 600; color: var(--ink-1); }
.nav-menu .m-desc { font-size: 12px; color: var(--ink-3); }

.nav-cta {
  padding: 7px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600;
  background: var(--brand); color: #fff !important; text-decoration: none;
  box-shadow: 0 1px 3px rgba(42, 120, 214, 0.35);
  transition: background 0.15s;
}
.nav-cta:hover { background: var(--brand-deep); }

/* ============ 页面骨架 ============ */
.page { max-width: 1180px; margin: 0 auto; padding: 40px 24px 80px; }
.page.narrow { max-width: 880px; }

.page-head { margin-bottom: 32px; }
.crumbs { font-size: 12.5px; color: var(--ink-3); margin-bottom: 10px; }
.crumbs a { color: var(--ink-3); text-decoration: none; }
.crumbs a:hover { color: var(--brand); }
.crumbs .sep { margin: 0 6px; color: var(--baseline); }

h1.title { font-size: 34px; line-height: 1.3; font-weight: 700; letter-spacing: -0.3px; margin: 0 0 8px; }
.subtitle { font-size: 16.5px; color: var(--ink-2); max-width: 860px; margin: 0; }

h2 { font-size: 23px; font-weight: 700; letter-spacing: -0.2px; margin: 52px 0 8px; }
h2:first-of-type { margin-top: 36px; }
h3 { font-size: 17.5px; font-weight: 650; margin: 30px 0 6px; }
h4 { font-size: 15px; font-weight: 650; margin: 20px 0 4px; color: var(--ink-1); }

.section-lede { color: var(--ink-2); margin: 0 0 20px; max-width: 860px; }

/* ============ 卡片 ============ */
.card {
  background: var(--surface-1); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 22px 24px;
}
.card.lift { box-shadow: var(--shadow); }
.card.hover { transition: box-shadow 0.18s, transform 0.18s, border-color 0.18s; cursor: pointer; text-decoration: none; color: inherit; display: block; }
.card.hover:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); border-color: #cfddf2; }

.grid { display: grid; gap: 16px; }
.grid.g2 { grid-template-columns: repeat(2, 1fr); }
.grid.g3 { grid-template-columns: repeat(3, 1fr); }
.grid.g4 { grid-template-columns: repeat(4, 1fr); }
.grid.g23 { grid-template-columns: repeat(2, 1fr); }
@media (max-width: 960px) {
  .grid.g3, .grid.g4 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
  .grid.g2, .grid.g3, .grid.g4 { grid-template-columns: 1fr; }
}

.card h3, .card h4 { margin-top: 0; }
.card .kicker {
  font-size: 11.5px; font-weight: 700; letter-spacing: 1.2px;
  text-transform: uppercase; color: var(--brand); margin-bottom: 6px;
}
.card p { margin: 0 0 10px; color: var(--ink-2); }
.card p:last-child { margin-bottom: 0; }
.card ul, .card ol { margin: 0; padding-left: 20px; color: var(--ink-2); }
.card li { margin: 4px 0; }

/* ============ 徽章 / 标签 ============ */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; letter-spacing: 0.3px;
  padding: 2.5px 9px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--hairline);
  vertical-align: 2px; white-space: nowrap;
}
.badge.b-blue   { background: var(--brand-wash); color: var(--brand-ink); border-color: #cfe0f6; }
.badge.b-green  { background: #e8f6e8; color: #005200; border-color: #cdeacd; }
.badge.b-orange { background: #fdeee6; color: #8a3512; border-color: #f6d8c8; }
.badge.b-violet { background: #eeecf8; color: #38327f; border-color: #dcD8f0; }
.badge.b-gray   { background: var(--surface-2); color: var(--ink-2); }
.badge.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.dot.g::before { background: var(--good); }
.badge.dot.w::before { background: var(--warning); }
.badge.dot.s::before { background: var(--serious); }
.badge.dot.c::before { background: var(--critical); }

/* ============ 统计块（KPI 行） ============ */
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 860px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }
.stat {
  background: var(--surface-1); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 16px 20px;
}
.stat .s-label { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.stat .s-value { font-size: 30px; font-weight: 650; letter-spacing: -0.5px; line-height: 1.25; margin: 2px 0 0; }
.stat .s-delta { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.stat .s-delta .up { color: var(--good-text); font-weight: 600; }
.stat .s-delta .down { color: var(--critical); font-weight: 600; }

/* ============ 表格 ============ */
.tablewrap { overflow-x: auto; border: 1px solid var(--hairline); border-radius: var(--radius); background: var(--surface-1); }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.tbl th {
  text-align: left; font-weight: 650; color: var(--ink-2);
  background: var(--surface-2); padding: 9px 14px;
  border-bottom: 1px solid var(--hairline); white-space: nowrap;
  font-size: 12.5px; letter-spacing: 0.3px;
}
.tbl td { padding: 9px 14px; border-bottom: 1px solid var(--hairline); color: var(--ink-2); vertical-align: top; }
.tbl tr:last-child td { border-bottom: none; }
.tbl td:first-child { color: var(--ink-1); font-weight: 550; }
.tbl tr:hover td { background: #f7f9fc; }
.tbl .num { font-variant-numeric: tabular-nums; text-align: right; }

/* ============ 代码 / 提示块 ============ */
.codeblock {
  background: var(--surface-2); border: 1px solid var(--hairline);
  border-radius: var(--radius-s); padding: 14px 16px;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.7;
  overflow-x: auto; color: var(--ink-1); white-space: pre;
}
.callout {
  border-left: 3px solid var(--brand);
  background: var(--brand-wash);
  border-radius: 0 var(--radius-s) var(--radius-s) 0;
  padding: 12px 18px; margin: 16px 0; font-size: 14px; color: var(--ink-2);
}
.callout strong { color: var(--ink-1); }
.callout.warn { border-left-color: var(--warning); background: #fdf6e5; }
.callout.good { border-left-color: var(--good); background: #eff8ef; }

/* ============ 页签 Tabs ============ */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hairline); margin: 22px 0 20px; flex-wrap: wrap; }
.tab {
  padding: 8px 16px; font-size: 13.5px; font-weight: 550; color: var(--ink-3);
  border: none; background: none; cursor: pointer; border-radius: 8px 8px 0 0;
  border-bottom: 2px solid transparent; margin-bottom: -1px; font-family: inherit;
}
.tab:hover { color: var(--ink-1); background: var(--surface-2); }
.tab.on { color: var(--brand-deep); border-bottom-color: var(--brand); }
.tabpanel { display: none; }
.tabpanel.on { display: block; animation: fadein 0.25s ease; }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

/* ============ 手风琴 ============ */
details.acc {
  background: var(--surface-1); border: 1px solid var(--hairline);
  border-radius: var(--radius-s); margin: 10px 0; overflow: hidden;
}
details.acc summary {
  cursor: pointer; padding: 13px 18px; font-weight: 600; font-size: 14.5px;
  display: flex; align-items: center; gap: 10px; list-style: none;
}
details.acc summary::-webkit-details-marker { display: none; }
details.acc summary::before {
  content: "+"; width: 20px; height: 20px; border-radius: 6px;
  background: var(--surface-2); color: var(--ink-2);
  display: inline-grid; place-items: center; font-size: 14px; font-weight: 700;
  flex-shrink: 0; transition: transform 0.18s;
}
details.acc[open] summary::before { content: "−"; background: var(--brand-wash); color: var(--brand-deep); }
details.acc[open] summary { background: #f8fafd; border-bottom: 1px solid var(--hairline); }
details.acc .acc-body { padding: 14px 18px 16px 48px; color: var(--ink-2); font-size: 14px; }
details.acc .acc-body ul, details.acc .acc-body ol { padding-left: 20px; }
details.acc .acc-body li { margin: 5px 0; }

/* ============ 步骤条 / 流程 ============ */
.flow { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; margin: 20px 0; }
.flow-step {
  flex: 1; min-width: 150px; position: relative;
  background: var(--surface-1); border: 1px solid var(--hairline);
  padding: 14px 16px 14px 20px; margin-right: 26px; margin-bottom: 12px;
  border-radius: var(--radius-s);
}
.flow-step::after {
  content: "→"; position: absolute; right: -21px; top: 50%; transform: translateY(-50%);
  color: var(--baseline); font-size: 15px; font-weight: 700;
}
.flow-step:last-child { margin-right: 0; }
.flow-step:last-child::after { content: none; }
.flow-step .f-num {
  position: absolute; left: -10px; top: 12px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--brand); color: #fff; font-size: 12px; font-weight: 700;
  display: grid; place-items: center; box-shadow: 0 0 0 3px var(--page);
}
.flow-step .f-title { font-weight: 650; font-size: 14px; margin-bottom: 3px; }
.flow-step .f-desc { font-size: 12.5px; color: var(--ink-3); line-height: 1.55; }

/* ============ 时间线（路线图） ============ */
.timeline { position: relative; margin: 30px 0; }
.timeline::before {
  content: ""; position: absolute; left: 15px; top: 8px; bottom: 8px;
  width: 2px; background: var(--hairline);
}
.t-item { position: relative; padding: 0 0 26px 52px; }
.t-item:last-child { padding-bottom: 0; }
.t-dot {
  position: absolute; left: 4px; top: 4px; width: 24px; height: 24px;
  border-radius: 50%; background: var(--surface-1);
  border: 2px solid var(--brand); display: grid; place-items: center;
  box-shadow: 0 0 0 4px var(--page); z-index: 1;
}
.t-dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }
.t-item.t-done .t-dot { border-color: var(--good); }
.t-item.t-done .t-dot::after { background: var(--good); }
.t-item.t-now .t-dot { border-color: var(--warning); box-shadow: 0 0 0 4px var(--page), 0 0 0 7px rgba(250,178,25,0.28); }
.t-item.t-now .t-dot::after { background: var(--warning); }
.t-item.t-plan .t-dot { border-color: var(--baseline); }
.t-item.t-plan .t-dot::after { background: var(--baseline); }
.t-time { font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: var(--brand-deep); text-transform: uppercase; }
.t-title { font-size: 16.5px; font-weight: 650; margin: 2px 0 6px; }
.t-body { color: var(--ink-2); font-size: 14px; }

/* ============ 架构图（SVG 容器） ============ */
.diagram { background: var(--surface-1); border: 1px solid var(--hairline); border-radius: var(--radius); padding: 20px; overflow-x: auto; }
.diagram svg { display: block; margin: 0 auto; }
.diagram .d-cap { text-align: center; font-size: 12.5px; color: var(--ink-3); margin-top: 12px; }

/* 图内通用样式 */
.dg-box { fill: var(--surface-1); stroke: var(--hairline); rx: 8; }
.dg-box-blue { fill: var(--brand-wash); stroke: #cfe0f6; }
.dg-label { font-family: var(--sans); fill: var(--ink-1); font-size: 13px; font-weight: 600; }
.dg-sub { font-family: var(--sans); fill: var(--ink-3); font-size: 11px; }
.dg-arrow { stroke: var(--baseline); stroke-width: 1.6; fill: none; marker-end: url(#arr); }
.dg-dash { stroke-dasharray: 5 4; }

/* ============ 页脚 ============ */
.footer {
  border-top: 1px solid var(--hairline); background: var(--surface-1);
  padding: 34px 24px 44px; margin-top: 40px;
}
.footer-inner { max-width: 1180px; margin: 0 auto; display: flex; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.footer .f-title { font-size: 13px; font-weight: 700; color: var(--ink-1); margin-bottom: 10px; }
.footer a { display: block; font-size: 12.5px; color: var(--ink-3); text-decoration: none; padding: 2.5px 0; }
.footer a:hover { color: var(--brand); }
.footer .f-note { font-size: 12px; color: var(--ink-3); max-width: 380px; }

/* ============ Hero ============ */
.hero {
  background:
    radial-gradient(1000px 420px at 78% -10%, rgba(42,120,214,0.10), transparent 62%),
    radial-gradient(700px 380px at 8% 108%, rgba(27,175,122,0.07), transparent 60%);
  border-bottom: 1px solid var(--hairline);
}
.hero-inner { max-width: 1180px; margin: 0 auto; padding: 64px 24px 56px; }
.hero h1 { font-size: 42px; line-height: 1.25; letter-spacing: -0.5px; margin: 14px 0 14px; font-weight: 750; max-width: 800px; }
.hero p.lead { font-size: 17px; color: var(--ink-2); max-width: 720px; margin: 0 0 26px; }
.hero-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }

/* ============ 按钮组 ============ */
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 18px; border-radius: 9px; font-size: 14px; font-weight: 600;
  text-decoration: none; cursor: pointer; border: 1px solid transparent; font-family: inherit;
  transition: background 0.15s, border-color 0.15s;
}
.btn.primary { background: var(--brand); color: #fff; box-shadow: 0 1px 3px rgba(42,120,214,0.35); }
.btn.primary:hover { background: var(--brand-deep); }
.btn.ghost { background: var(--surface-1); color: var(--ink-1); border-color: var(--hairline); }
.btn.ghost:hover { border-color: var(--brand); color: var(--brand-deep); }

/* ============ 上下页导航 ============ */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 56px; }
@media (max-width: 640px) { .pager { grid-template-columns: 1fr; } }
.pager a {
  display: block; background: var(--surface-1); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 16px 20px; text-decoration: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.pager a:hover { border-color: var(--brand); box-shadow: var(--shadow); }
.pager .p-dir { font-size: 11.5px; color: var(--ink-3); font-weight: 600; letter-spacing: 0.6px; }
.pager .p-title { font-size: 15.5px; font-weight: 650; color: var(--ink-1); margin-top: 3px; }
.pager a.next { text-align: right; }

/* ============ 图表通用（SVG 图） ============ */
.chart { font-family: var(--sans); }
.chart .axis-line { stroke: var(--baseline); stroke-width: 1; }
.chart .gridline { stroke: var(--hairline); stroke-width: 1; }
.chart .tick { fill: var(--ink-3); font-size: 11px; }
.chart .bar { rx: 3px; }
.chart-tooltip {
  position: fixed; pointer-events: none; z-index: 200;
  background: var(--ink-1); color: #fff; border-radius: 8px;
  padding: 8px 12px; font-size: 12.5px; line-height: 1.55;
  box-shadow: var(--shadow-lift); max-width: 340px;
  opacity: 0; transform: translate(-50%, calc(-100% - 10px)); transition: opacity 0.12s;
}
.chart-tooltip.show { opacity: 1; }
.chart-tooltip .tt-title { font-weight: 700; margin-bottom: 2px; }
.chart-tooltip .tt-row { display: flex; align-items: flex-start; gap: 7px; white-space: normal; }
.chart-tooltip .tt-key { width: 12px; height: 3px; border-radius: 2px; flex-shrink: 0; margin-top: 7px; }
.chart-tooltip .tt-val { font-weight: 650; margin-left: auto; padding-left: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ============ Demo 专用 ============ */
.demo-shell { display: flex; flex-direction: column; height: 100vh; background: var(--page); overflow: hidden; }
.app-head {
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  background: var(--surface-1); border-bottom: 1px solid var(--hairline);
  padding: 0 18px; height: 52px;
}

      var html = title ? '<div class="tt-title"></div>' : "";
      html += rows.map(function () { return '<div class="tt-row"></div>'; }).join("");
      t.innerHTML = html;
      var nodes = t.querySelectorAll(".tt-row");
      rows.forEach(function (r, i) {
        if (title && i === 0 && t.querySelector(".tt-title")) t.querySelector(".tt-title").textContent = title;
        var row = nodes[i];
        var key = document.createElement("span"); key.className = "tt-key";
        key.style.background = r.color || "#fff";
        var name = document.createElement("span"); name.textContent = r.name || "";
        var val = document.createElement("span"); val.className = "tt-val"; val.textContent = r.value != null ? r.value : "";
        row.appendChild(key); row.appendChild(name); row.appendChild(val);
      });
      if (title) {
        var tEl = t.querySelector(".tt-title");
        if (tEl && rows.length && nodes[0]) nodes[0].insertBefore(tEl, nodes[0].firstChild);
      }
      t.classList.add("show");
      t.style.left = x + "px";
      t.style.top = y + "px";
      // 边界保护：左右上下都不许溢出视口
      var vw = window.innerWidth, vh = window.innerHeight;
      var r = t.getBoundingClientRect();
      if (r.left < 8) t.style.left = (8 + r.width / 2) + "px";
      if (r.right > vw - 8) t.style.left = (vw - 8 - r.width / 2) + "px";
      r = t.getBoundingClientRect();
      if (r.top < 8) t.style.top = (18 + r.height + 10) + "px";
      if (r.bottom > vh - 8) t.style.top = (vh - 2) + "px";
    },
    hide: function () { if (tipEl) tipEl.classList.remove("show"); }
  };

  /* SVG helper（简写创建） */
  window.svgEl = function (tag, attrs, text) {
    var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
    if (attrs) Object.keys(attrs).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    if (text != null) el.textContent = text;
    return el;
  };
})();

function stopTrace() { TRACE_TIMERS.forEach(function (x) { clearTimeout(x); }); TRACE_TIMERS = []; }
var TRACE_KIND_LABELS = {
  observe: "观察", decision: "决策", call: "调用服务", result: "服务返回",
  ask: "追问用户", handoff: "转人工", finish: "完成"
};
var TRACE_STATE_LABELS = {
  READY: "待开始", RUNNING: "运行中", TOOL_RUNNING: "服务调用中",
  COMPLETED: "已完成", WAITING_USER: "等待用户补充",
  HUMAN_CONFIRM_REQUIRED: "等待人工确认"
};
RENDER = window.RENDER || {};
RENDER.agenttrace = function () {
  stopTrace();
  var main = document.getElementById("demo-main");
  main.innerHTML =
    '<div class="mod-head">🧠 Agent 运行轨迹<span class="sub">观察 → 决策 → 调用服务 → 服务返回 → 再决策</span><span class="tipmark" data-tiptitle="真实性口径" data-tip="机制:对应线上真实的多轮服务决策与状态变化|演示数据:问题、参数、返回值和运行编号均为 Mock|可观察:每轮服务、参数、结果摘要、状态、下一动作与停止原因|边界:展示结构化决策摘要，不展示模型隐藏思维过程">ⓘ 说明</span></div>' +
    '<div class="trace-note"><b>“调用服务”对应技术事件 tool_call，“服务返回”对应 tool_result。</b><span>主轨迹与 Agent 页使用同一个低温重启交付放行案例。Agent 按任务调用必要服务；无关服务不会为了凑齐六项而被机械调用。问题、参数、返回结果和运行编号均为 Mock。</span></div>' +
    '<div class="trace-controls" id="trace-controls"></div>' +
    '<div class="trace-query"><span>用户任务</span><b id="trace-query"></b></div>' +
    '<div class="trace-layout"><div class="trace-list" id="trace-list"></div>' +
      '<aside class="trace-state"><h4>当前运行状态</h4>' +
        '<div class="trace-state-row"><span>运行编号</span><b id="trace-id">—</b></div>' +
        '<div class="trace-state-row"><span>当前状态</span><b id="trace-status">待开始</b></div>' +
        '<div class="trace-state-row"><span>决策轮次</span><b id="trace-round">—</b></div>' +
        '<div class="trace-state-row"><span>服务调用次数</span><b id="trace-tools">0</b></div>' +
        '<div class="trace-state-row"><span>下一步</span><b id="trace-next">等待开始</b></div>' +
        '<div class="trace-outcome" id="trace-outcome"></div>' +
      '</aside></div>';
  var controls = document.getElementById("trace-controls");
  Object.keys(AGENT_RUNS).forEach(function (key) {
    var b = document.createElement("button");
    b.textContent = AGENT_RUNS[key].label;
    b.dataset.run = key;
    b.addEventListener("click", function () { startRun(key); });
    controls.appendChild(b);
  });
  var replay = document.createElement("button");
  replay.className = "trace-replay";
  replay.textContent = "↻ 重播当前轨迹";
  replay.addEventListener("click", function () { startRun(controls.dataset.current || "multi"); });
  controls.appendChild(replay);

  function startRun(key) {
    stopTrace();
    var run = AGENT_RUNS[key];
    controls.dataset.current = key;
    controls.querySelectorAll("button[data-run]").forEach(function (b) { b.classList.toggle("on", b.dataset.run === key); });
    document.getElementById("trace-query").textContent = run.query;
    document.getElementById("trace-id").textContent = "AG-2026-0908-" + ({ multi: "018", ask: "019", stop: "020", risk: "021" }[key]);
    document.getElementById("trace-status").textContent = TRACE_STATE_LABELS.READY;
    document.getElementById("trace-round").textContent = "—";
    document.getElementById("trace-tools").textContent = "0";
    document.getElementById("trace-next").textContent = "读取任务";
    var outcome = document.getElementById("trace-outcome");
    outcome.classList.remove("show");
    outcome.textContent = run.outcome;
    var list = document.getElementById("trace-list");
    list.innerHTML = "";
    run.steps.forEach(function (step) {
      var row = document.createElement("div");
      row.className = "trace-event " + step.k;
      row.innerHTML = '<span class="tr-round"></span><span class="tr-kind"></span><div class="tr-body"><b></b><p></p></div>';
      row.querySelector(".tr-round").textContent = step.r;
      row.querySelector(".tr-kind").textContent = TRACE_KIND_LABELS[step.k] || step.k;
      row.querySelector("b").textContent = step.t;
      row.querySelector("p").textContent = step.d;
      list.appendChild(row);
    });
    var rows = list.querySelectorAll(".trace-event");
    run.steps.forEach(function (step, i) {
      TRACE_TIMERS.push(setTimeout(function () {
        if (i > 0) { rows[i - 1].classList.remove("active"); rows[i - 1].classList.add("done"); }
        rows[i].classList.add("active");
        document.getElementById("trace-status").textContent = TRACE_STATE_LABELS[step.s] || step.s;
        document.getElementById("trace-round").textContent = step.r;
        document.getElementById("trace-tools").textContent = String(step.tool || 0);
        document.getElementById("trace-next").textContent = step.n;
        list.scrollTo({ top: Math.max(0, rows[i].offsetTop - list.offsetTop - 150), behavior: "smooth" });
        if (i === run.steps.length - 1) {
          TRACE_TIMERS.push(setTimeout(function () {
            rows[i].classList.remove("active"); rows[i].classList.add("done");
            document.getElementById("trace-status").textContent = TRACE_STATE_LABELS[run.finalState] || run.finalState;
            outcome.classList.add("show");
          }, 420));
        }
      }, 180 + i * 520));
    });
  }
  startRun("multi");
};

RENDER.stream = function () {

  var feed = document.getElementById("feed");

    var i = Math.floor(Math.random() * EVPOOL.length);

    while (feed.children.length > 30) feed.removeChild(feed.lastChild);
  }
  for (var k = 0; k < 9; k++) push();
  STREAM_IV = setInterval(function () { if (running) push(); }, 2000);

/* ================= 路由 ================= */
var STREAM_IV = null;
function stopStream() { if (STREAM_IV) { clearInterval(STREAM_IV); STREAM_IV = null; } }
function setChrome(domain, name, user) {
  document.getElementById("ah-sys").textContent = name;
  document.getElementById("ah-dom").textContent = domain;
  var cu = document.getElementById("chrome-user"), lo = document.getElementById("chrome-logout");
  if (user) { cu.textContent = user; lo.style.display = ""; } else { cu.textContent = ""; lo.style.display = "none"; }
}
function buildNav(sys) {
  var side = document.getElementById("demo-side");
  side.innerHTML = "";
  var S = SYSTEMS[sys];
  var g = document.createElement("div");
  g.className = "ds-group";
  g.textContent = S.name;
  side.appendChild(g);
  S.nav.forEach(function (m) {
    var b = document.createElement("button");
    b.textContent = m.t; b.dataset.mod = m.id;
    b.addEventListener("click", function () { location.hash = "#/" + sys + "/" + m.id; });
    side.appendChild(b);
  });
}
function route() {
  stopStream();
  stopTrace();
  var h = location.hash.replace(/^#\/?/, "");
  var seg = h.split("/");
  var sys = seg[0] || "login";
  if (sys === "login" || !SYSTEMS[sys]) {
    document.querySelector(".demo-shell").classList.add("logged-out");
    setChrome("sso.zhidun.internal", "智盾统一身份认证", null);
    RENDER.login();
    return;
  }
  if (sys === "pano") {
    document.querySelector(".demo-shell").classList.add("logged-out");
    setChrome("zhidun.internal", "平台全景 · 服务目录", null);
    RENDER.svcs();
    return;
  }
  document.querySelector(".demo-shell").classList.remove("logged-out");
  var S = SYSTEMS[sys];
  setChrome(S.domain, S.name, S.user);
  buildNav(sys);
  var mod = seg[1] && RENDER[seg[1]] ? seg[1] : S.nav[0].id;
  document.querySelectorAll(".demo-side button").forEach(function (x) { x.classList.toggle("on", x.dataset.mod === mod); });
  RENDER[mod]();
}
document.getElementById("chrome-logout").addEventListener("click", function () { location.hash = "#/login"; });
window.addEventListener("hashchange", route);
route();
